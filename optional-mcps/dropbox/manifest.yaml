# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: dropbox
description: Search, read, and manage files in Dropbox.
source: https://help.dropbox.com/integrations/connect-dropbox-mcp-server

# Official vendor-hosted remote MCP (URL-only — X19 never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration
# (verified live: RFC 9728 protected-resource metadata -> AS metadata with
# registration_endpoint); X19's MCP client + mcp_oauth_manager handle
# discovery, PKCE, token exchange, and refresh.

transport:
  type: http
  url: https://mcp.dropbox.com/mcp

auth:
  type: oauth

# Excluded: account quota probe and the niche file-request feature trio.
tools:
  default_excluded:
    - GetUsageAndQuota
    - CreateFileRequest
    - GetFileRequest
    - ListFileRequests

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - dropbox
  hosts:
    - dropbox.com

post_install: |
  On first connection X19 opens a browser to authorize with
  Dropbox (or run `x19 mcp login dropbox`). Approve access,
  then restart the session so tools load.
