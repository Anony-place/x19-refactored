# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: vercel
description: >-
  Deployments, logs, and projects via Vercel's hosted MCP.
source: https://vercel.com/docs/mcp

# Official vendor-hosted remote MCP (URL-only — X19 never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration;
# X19's MCP client + mcp_oauth_manager handle discovery, PKCE, token
# exchange, and refresh.
# No `vercel.app` suggest host on purpose: pasted deploy-preview links are
# about the site being previewed, not about managing Vercel.
transport:
  type: http
  url: https://mcp.vercel.com

auth:
  type: oauth

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - vercel
  hosts:
    - vercel.com

post_install: |
  On first connection X19 opens a browser to authorize with
  Vercel (or run `x19 mcp login vercel`). Approve access,
  then restart the session so tools load.
