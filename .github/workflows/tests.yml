name: tests

# The whole suite used to be un-runnable in CI: the only workflows were scoped
# to `runtime/**` and `brain/**`, so a change to agent.py, tools.py or
# execution/ merged with nothing but hand-run assertions to back it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        # pyte is test-only: it is the terminal emulator that lets the pty tests
        # assert on the *screen* (row ghosts, duplicated ribbons, prompt geometry)
        # instead of on the raw byte stream, where every repaint looks like a new
        # line. Without it those assertions skip rather than lie.
        run: python -m pip install --quiet requests rich PyJWT pypdf pyte

      - name: Compile every module
        run: |
          python - <<'PY'
          import compileall, sys
          ok = compileall.compile_dir(".", quiet=2, force=True,
                                       maxlevels=6, rx=__import__("re").compile(r"(__pycache__|datasets|\.git)"))
          sys.exit(0 if ok else 1)
          PY

      - name: Full unit + integration suite
        shell: bash
        run: |
          set -uo pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee /tmp/suite.log
          exit "${PIPESTATUS[0]}"

      # Raw logs are not always reachable (a sandboxed reviewer, an expired
      # artifact host), so a red suite has to say *what* failed on the PR itself.
      - name: Annotate failures
        if: failure()
        run: |
          python - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/suite.log").read_text(errors="replace")
          names = re.findall(r"^(?:FAIL|ERROR): (.+)$", log, re.M)
          for name in names[:20]:
              print(f"::error title=failing test::{name}")
          blocks = [b.strip() for b in re.split(r"={30,}", log)
                    if b.strip().startswith(("FAIL:", "ERROR:"))]
          for block in blocks[:6]:
              body = "%0A".join(block.splitlines()[:30])
              print(f"::error title=failure detail::{body}")
          if not names:
              # No FAIL/ERROR line means the run died mid-test: report where.
              tail = "%0A".join(log.strip().splitlines()[-25:])
              print(f"::error title=suite stopped here::{tail}")
          PY

      # A fresh clone must be able to start an assessment without a manual
      # setup step when a provider is supplied by flag or environment.
      - name: CLI smoke — bare target resolves without setup ceremony
        run: |
          python x19.py --version
          X19_AI_BASE_URL=http://127.0.0.1:9/v1 X19_AI_MODEL=smoke \
            python x19.py run 127.0.0.1:9 --json --max-iterations 1 > /tmp/smoke.json \
            || echo "run exited non-zero (expected: provider unreachable) — CLI contract held"
          # Machine mode is a contract, not a hint: stdout is one JSON document
          # and every human line went to stderr. Parse it or fail the build.
          python - <<'PY'
          import json, pathlib
          raw = pathlib.Path("/tmp/smoke.json").read_text()
          document = json.loads(raw)
          assert document.get("target") == "127.0.0.1:9", document
          print("smoke: stdout parsed as one JSON document —", document.get("status"))
          PY
