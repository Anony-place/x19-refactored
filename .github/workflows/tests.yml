name: tests

# The whole suite used to be un-runnable in CI: the only workflows were scoped
# to `runtime/**` and `brain/**`, so a change to agent.py, tools.py or
# execution/ merged with nothing but hand-run assertions to back it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        run: python -m pip install --quiet requests rich PyJWT pypdf

      - name: Compile every module
        run: |
          python - <<'PY'
          import compileall, sys
          ok = compileall.compile_dir(".", quiet=2, force=True,
                                       maxlevels=6, rx=__import__("re").compile(r"(__pycache__|datasets|\.git)"))
          sys.exit(0 if ok else 1)
          PY

      - name: Full unit + integration suite
        run: python -m unittest discover -s tests -t . -v

      # A fresh clone must be able to start an assessment without a manual
      # setup step when a provider is supplied by flag or environment.
      - name: CLI smoke — bare target resolves without setup ceremony
        run: |
          python x19.py --version
          X19_AI_BASE_URL=http://127.0.0.1:9/v1 X19_AI_MODEL=smoke \
            python x19.py run 127.0.0.1:9 --json --max-iterations 1 \
            || echo "run exited non-zero (expected: provider unreachable) — CLI contract held"
