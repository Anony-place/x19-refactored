name: X19 Plugin Validate
description: >-
  Validate an X19 plugin (plugin.yaml manifest schema AND
  declared-vs-actually-registered capabilities) using
  `x19 plugins validate`. Drop this into your plugin repo's CI:

    - uses: actions/checkout@<sha>
    - uses: Anony-place/x19-refactored/.github/actions/plugin-validate@main
      with:
        path: .

  The caller's job owns checkout; this action installs Python + x19
  (git install — a supported CI-context install route) and runs the
  validator against your plugin directory.

inputs:
  path:
    description: Path to the plugin directory (containing plugin.yaml).
    default: "."
  x19-ref:
    description: x19 git ref (branch/tag/sha) to install and validate with.
    default: "main"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.11"

    - name: Install x19
      shell: bash
      env:
        _X19_REF: ${{ inputs.x19-ref }}
      run: |
        set -euo pipefail
        # CI-context install from git; the ref lets plugin authors validate
        # against a pinned x19 release instead of main.
        pip install "git+https://github.com/Anony-place/x19-refactored@${_X19_REF}"

    - name: Validate plugin
      shell: bash
      env:
        _PLUGIN_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail
        # `x19 plugins validate` checks the plugin.yaml manifest schema
        # and loads the plugin in a scratch subprocess to verify that the
        # capabilities it DECLARES match what it actually registers.
        if x19 plugins validate "$_PLUGIN_PATH"; then
          echo "✅ PASS: plugin at '$_PLUGIN_PATH' validated cleanly"
        else
          echo "❌ FAIL: plugin at '$_PLUGIN_PATH' failed validation (see output above)"
          exit 1
        fi
